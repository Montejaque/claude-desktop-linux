name: Build Claude Desktop Installer AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage (Ubuntu 20.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Ubuntu 20.04 container
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work ubuntu:20.04 bash -Eeuo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3-tk curl ca-certificates file libfuse2 libglib2.0-0 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0
            python3 -m pip install --no-cache-dir "pip==24.3.1"
            python3 -m pip install --no-cache-dir "pyinstaller==6.11.1" "reportlab==4.2.5"
            python3 -m unittest discover -s tests -v
            bash scripts/build-appimage.sh
            python3 scripts/build-help-pdf.py
            test -s dist/Claude-Desktop-Installer-x86_64.AppImage
            test -s dist/Guia-Ayuda-Claude-Desktop.pdf
            file dist/Claude-Desktop-Installer-x86_64.AppImage
          '

      - name: Upload AppImage and PDF
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-Installer-Linux
          path: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Claude Desktop Installer 1.0.1
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
