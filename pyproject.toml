[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-desktop-linux-installer"
version = "1.0.4"
description = "Per-user installer for official Anthropic Claude Desktop on Linux"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gallego Orellana - Punto Vuela Montejaque", email = "montejaque@puntosvuela.es" }]
dependencies = []

[project.scripts]
claude-desktop-installer = "claude_installer.app:main"

[tool.setuptools.packages.find]
include = ["claude_installer*"]
