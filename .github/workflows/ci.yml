name: Tests and AppImage
on:
  push:
    branches: [main, official-anthropic-installer]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  appimage:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-tk curl file libfuse2 libglib2.0-0 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0
          python3 -m pip install --upgrade pip
          python3 -m pip install "pyinstaller==6.11.1"
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-Installer-AppImage
          path: dist/*.AppImage
