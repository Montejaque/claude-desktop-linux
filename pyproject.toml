[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-desktop-linux-installer"
version = "0.1.0"
description = "Per-user graphical installer and compatibility checker for Claude Desktop on Linux"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary - license to be decided" }
authors = [{ name = "Montejaque" }]
dependencies = []

[project.scripts]
claude-desktop-installer = "claude_installer.app:main"

[tool.setuptools.packages.find]
include = ["claude_installer*"]
