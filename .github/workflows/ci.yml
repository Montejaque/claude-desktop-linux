name: Build Claude Desktop Installer AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-tk python3-dev python3.8-dev python3-pip curl ca-certificates file libfuse2 binutils patchelf
          python3 -m pip install --upgrade "pip<25"
          python3 -m pip install "pyinstaller==6.11.1" "reportlab==4.2.5"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build AppImage
        run: |
          bash scripts/build-appimage.sh
          python3 scripts/build-help-pdf.py
          test -s dist/Claude-Desktop-Installer-x86_64.AppImage
          test -s dist/Guia-Ayuda-Claude-Desktop.pdf
          file dist/Claude-Desktop-Installer-x86_64.AppImage

      - name: Upload AppImage and PDF
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-Installer-Linux-${{ github.ref_name }}
          path: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Claude Desktop Installer ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
