name: Build Claude Desktop Installer AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk curl ca-certificates file libfuse2
          python -m pip install --upgrade "pip<25"
          python -m pip install "pyinstaller==6.11.1" "reportlab==4.2.5"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build AppImage
        run: |
          bash scripts/build-appimage.sh
          python scripts/build-help-pdf.py
          test -s dist/Claude-Desktop-Installer-x86_64.AppImage
          test -s dist/Guia-Ayuda-Claude-Desktop.pdf
          file dist/Claude-Desktop-Installer-x86_64.AppImage

      - name: Upload AppImage and PDF
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-Installer-Linux
          path: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Claude Desktop Installer 1.0.1
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Claude-Desktop-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Claude-Desktop.pdf
